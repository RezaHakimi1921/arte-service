# Production stack for service.artepersia.com
# Nothing is published on the host. Postgres and the API live on an internal network;
# only the web container joins the edge proxy's network.
name: arte-service

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: arte
      POSTGRES_USER: arte
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arte -d arte"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    shm_size: 128mb

  api:
    build:
      context: ..
      dockerfile: src/Arte.Api/Dockerfile
    image: arte-service-api:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=arte;Username=arte;Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY:?set in .env}
      Otp__Pepper: ${OTP_PEPPER:?set in .env}
      Signup__InviteCode: ${SIGNUP_INVITE_CODE:?set in .env}
      Signup__RequireInviteCode: ${SIGNUP_REQUIRE_INVITE:-false}
      Auth__PasswordLoginEnabled: ${PASSWORD_LOGIN:-false}
      Auth__OpenMode: ${OPEN_MODE:-false}
      Sms__Provider: ${SMS_PROVIDER:-fake}
      Sms__AllowFakeInProduction: ${SMS_ALLOW_FAKE:-false}
      Sms__FakeAllowedMobiles__0: ${SMS_FAKE_MOBILE_1:-}
      Sms__FakeAllowedMobiles__1: ${SMS_FAKE_MOBILE_2:-}
      Sms__SmsIr__ApiKey: ${SMSIR_API_KEY:-}
      Sms__SmsIr__Templates__auth_otp: ${SMSIR_OTP_TEMPLATE_ID:-0}
      Sms__SmsIr__ParamNames__code: ${SMSIR_OTP_PARAM:-CODE}
    # "egress" is the only route out (to the SMS provider); the database stays on the internal-only network.
    # Unique alias: the web container also sits on the edge network, where plain "api"
    # resolves to the PersonalWallet API.
    networks:
      internal:
        aliases: [arte-api]
      egress: {}
    read_only: true
    tmpfs: ["/tmp"]
    volumes:
      - uploads:/app/uploads
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [api]
    # No published ports: the server's edge Caddy (PersonalWallet stack) terminates TLS
    # for service.artepersia.com and forwards to arte-web:80 on the shared network.
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../web/dist:/srv:ro
    networks:
      internal: {}
      edge:
        aliases: [arte-web]
    read_only: true
    tmpfs: ["/tmp", "/data", "/config"]
    cap_drop: [ALL]
    # The caddy binary carries a file capability for low ports; exec fails without it.
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]

networks:
  internal:
    internal: true
  egress: {}
  edge:
    external: true
    name: ${EDGE_NETWORK:-personalwallet_default}

volumes:
  db_data:
  uploads:
